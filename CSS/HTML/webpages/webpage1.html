<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <div class="flex-container">
    <div class="box">1</div>
    <div class="box">2</div>
    <div class="box">3</div>
  </div>
  <style>
    .flex-container {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.box {
  padding: 20px;
  border: 2px solid black;
  background-color: lightblue;
}

  </style>
  <html>
    <div class="grid-container">
      <div class="box">A</div>
      <div class="box">B</div>
      <div class="box">C</div>
    </div>
    
  </html>
  <style>
    .grid-container {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}
.box {
  padding: 20px;
  border: 2px solid black;
  background-color: lightcoral;
}

  </style>

 
  </html>
  
  

  
</body>
</html>
