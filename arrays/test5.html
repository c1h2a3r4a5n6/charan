<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>Document</title>
</head>
<body>
    <script>
        let nums_1=[1,2,3,4,5];
        console.log("normal for loop");
        for(let i=0;i<nums_1.length;i++)
    {
        console.log(nums_1[i]);
    }
    console.log("for in loop");
    for(let index in nums_1)
    {
        console.log(nums_1[index]);
    }
    console.log("for of loop");
    for(let val of nums_1)
    {
        console.log(val);
    }

    

    
    </script>
    
</body>
</html>
