<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        .abc{
            border-radius: 30px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <a href="#" class="navbar-brand">My Diary</a>

            <div>
                <button class="btn btn-light" id="login-btn">LogIn</button>
            </div>
        </div>
    </nav>
    <section class="container-fluid mt-4">
        <div class="row">
            <div class="col-md-5 m-auto">
                <div class="card">
                    <div class="card-header bg-dark text-white">
                        <h2>ToDo List</h2>
                    </div>
                    <div class="card-body">
                        <form id="task-form">
                            <div class="form-group">
                                <input type="text" placeholder="Enter Task" class="form-control" id="task-el">
                            </div>
                            <div class="form-group mt-3">
                                <input type="submit" class="btn btn-dark" value="Add Task">
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>


    <section class="container-fluid mt-4">
        <div class="row">
            <div class="col-md-5 m-auto"></div>
                <ul class="list-group" id="task-list">
                   
                </ul>
            </div>
        </div>
    </section>
<footer style="margin-bottom: 500px;"></footer>
    <script src="Tasks2.js"></script>
</body>
</html>
