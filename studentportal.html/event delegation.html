<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="parent">
        <button id="btn1">Click Me (BTN1)</button>
        <button id="btn2">Click Me (BTN2)</button>
        <button id="btn3">Click Me (BTN3)</button>
    </div>
    <script>
        let parent = document.querySelector(".parent");

        parent.addEventListener("click", (event) => {
            let clickedButtonId = event.target.id;

            if (clickedButtonId === "btn1") {
                console.log("btn1 is clicked");
            } else if (clickedButtonId === "btn2") {
                console.log("btn2 is clicked");
            } else if (clickedButtonId === "btn3") {
                console.log("btn3 is clicked");
            } else {
                console.log("Something else was clicked within the parent div.");
            }
        });
    </script>
</body>
</html>
