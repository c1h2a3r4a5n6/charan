<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zomato Timer</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-danger">
        <div class="container-fluid">
            <a href="#" class="navbar-brand">Zomato</a>

            <div>
                <button class="btn btn-light" id="login-btn">LogIn</button>
            </div>
        </div>
    </nav>
    <section class="container-fluid mt-4">
        <div class="row">
            <div class="col-md-5 m-auto">
                <div class="card">
                    <div class="card-header bg-danger text-white">
                        <h2 class="text-center">Js Stopwatch</h2>
                    </div>
                    <div class="card-body text-center">
                        <h1>
                            <span id="min">00</span>
                            <span id="sec">00</span>
                            <span id="m-sec">00</span>
                        </h1>
                        <div class="mt-3">
                            <button class="btn btn-success" id="start-btn">Start</button>
                            <button class="btn btn-danger" id="stop-btn">Stop</button>
                            <button class="btn btn-warning" id="reset-btn">ReSet</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
<footer style="margin-bottom:500px;"></footer>
<!-- Script Code -->
<script src="Timer.js"></script>
</body>
</html>
